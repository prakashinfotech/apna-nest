services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: apnanest-backend
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:5000

      # Supabase PostgreSQL
      ConnectionStrings__DefaultConnection: ${SUPABASE_DB_CONNECTION}

      # JWT
      JwtSettings__Secret: ${JWT_SECRET}

      # CORS
      FRONTEND_URLS: ${FRONTEND_URLS}

    ports:
      - "${BACKEND_PORT:-5020}:5000"


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

    container_name: apnanest-frontend
    restart: unless-stopped

    # Server-side rendering calls the public API URL. From inside the server that
    # address is not reachable (no NAT hairpin), so every page waited for a 10 s connect
    # timeout. Point the API hostname at the Docker host, where nginx serves it with its
    # real certificate.
    extra_hosts:
      - "apna-nest-api.prakashsoftwares.com:host-gateway"

    environment:
      NODE_ENV: production

    ports:
      - "${FRONTEND_PORT:-3020}:3000"

    depends_on:
      - backend
